[project]
name = "supply-chain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daino2002", email = "80028630+Konstantinos72002@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "databricks-sql-connector>=4.6.0",
    "gh>=0.0.4",
    "langchain-core>=1.6.9",
    "networkx>=3.7",
    "pydantic>=2.14.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
supply-chain = "supply_chain:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyspark>=4.2.0",
]
