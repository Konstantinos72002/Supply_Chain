[project]
name = "supply-chain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daino2002", email = "80028630+Konstantinos72002@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.143.0",
    "gh>=0.0.4",
    "httpx>=0.28.1",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "pydantic>=2.14.0",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.54.0",
]

[project.scripts]
supply-chain = "supply_chain:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
]
