[project]
name = "supply-chain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daino2002", email = "80028630+Konstantinos72002@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.149.0",
    "databricks-sql-connector>=4.6.0",
    "fastapi>=0.142.2",
    "gh>=0.0.4",
    "langchain-core>=1.6.8",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
supply-chain = "supply_chain:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
]
