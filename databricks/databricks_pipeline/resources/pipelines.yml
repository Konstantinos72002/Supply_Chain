# Databricks Asset Bundle: ONE ETL pipeline (raw -> Bronze -> Silver -> Gold) + the job that runs it.
# Deploy:  databricks bundle deploy -t dev        Run:  databricks bundle run medallion_job -t dev
variables:
  catalog:
    default: data2026acc123456
  schema:
    default: team4

resources:
  pipelines:
    medallion_pipeline:
      name: "team4-supply-chain-medallion-${bundle.target}"
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: false              # triggered: process new files, refresh views, stop
      channel: CURRENT
      libraries:                     # three source files, one dependency graph
        - file:
            path: ../pipelines/medallion/01_bronze.py
        - file:
            path: ../pipelines/medallion/02_silver.py
        - file:
            path: ../pipelines/medallion/03_gold.py
      configuration:
        pipeline.src_path: ${workspace.file_path}/src
        bronze.landing_root: /Volumes/${var.catalog}/${var.schema}/landing
        gold.as_of_date: ""          # brief snapshot_date; empty = today, yyyy-MM-dd to freeze
        spark.sql.session.timeZone: UTC
      event_log:
        catalog: ${var.catalog}
        schema: ${var.schema}
        name: ops_pipeline_event_log
      notifications:
        - email_recipients: ["team4-alerts@example.com"]
          alerts: ["on-update-failure", "on-update-fatal-failure", "on-flow-failure"]

  jobs:
    medallion_job:
      name: "team4-supply-chain-medallion-job-${bundle.target}"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # daily 06:00 UTC
        timezone_id: "UTC"
        pause_status: PAUSED
      tasks:
        - task_key: medallion_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.medallion_pipeline.id}
            full_refresh: false
        - task_key: bronze_checks
          depends_on: [{task_key: medallion_pipeline}]
          notebook_task:
            notebook_path: ../notebooks/02_bronze_checks.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}"}
        - task_key: silver_checks
          depends_on: [{task_key: medallion_pipeline}]
          notebook_task:
            notebook_path: ../notebooks/03_silver_checks.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}"}
        - task_key: gold_checks
          depends_on: [{task_key: medallion_pipeline}]
          notebook_task:
            notebook_path: ../notebooks/04_gold_checks.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}"}
